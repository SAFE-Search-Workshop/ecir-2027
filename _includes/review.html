
{% assign d = site.data.review %}
<section id="review" class="section">
  <div class="container">
    <h2>Interested in Reviewing?</h2>

    {% if d.intro %}
      {{ d.intro | markdownify }}
    {% endif %}

    {% if d.form_url %}
    <div class="submit-box">
      <a class="btn btn-solid"
         href="{{ d.form_url }}"
         target="_blank"
         rel="noopener noreferrer">
        {{ d.form_label | default: "Sign up to Review" }}
      </a>
    </div>
    {% endif %}
  </div>
</section>
