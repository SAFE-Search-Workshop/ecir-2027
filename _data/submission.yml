# Submission page (/submit/). Text fields support Markdown.
# Paper types/page limits are reused from _data/cfp.yml; deadlines from _data/dates.yml.

# OpenReview link. While empty, the button shows "Submission link opens soon".
form_url: ""
form_label: "Submit via OpenReview"

intro: >-
  We welcome submissions on safety, accountability, faithfulness, and evaluation in conversational
  search. Please read the guidelines below before submitting.

# Each group becomes a heading with a bullet list.
rules:
  - title: Format
    items:
      - "Page limits exclude references (see table above)."
      - "Papers must use the **CEURART single-column style**, per the [CEUR-WS submission guidelines](https://ceur-ws.org/HOWTOSUBMIT.html)."
      - "LaTeX template: [Overleaf](https://www.overleaf.com/latex/templates/template-for-submissions-to-ceur-workshop-proceedings-ceur-ws-dot-org/wqyfdgftmcfw)."
      - "Submissions must be in PDF format and written in English."

  - title: Review
    items:
      - "Each submission will be reviewed by at least two members of the Program Committee."
      - "Review model (single- or double-blind): **TBD**."
      - "Accepted research papers may be presented orally or as posters, as determined by the Program Committee."

  - title: Presentation and publication
    items:
      - "At least one author of each accepted contribution is expected to attend the workshop in person and present."
      - "We plan to publish accepted papers in CEUR Workshop Proceedings, subject to eligibility."

  - title: How to submit
    items:
      - "Submit via OpenReview: _link TBD_."
      - "Questions? Email us at [safe-search-workshop@googlegroups.com](mailto:safe-search-workshop@googlegroups.com)."
